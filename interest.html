<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@40,400,0,0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./my_style.css">
  <title>廖盈榕的個人簡歷</title>
</head>

<body class="min-vh-100 d-flex flex-column">
  <header>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container">
        <div class="col-1"></div>
        <div class="col-10">
          <h2 class="display-4">Dream Until Your Dream Comes True.</h2>
          <h3>但我喜歡跌倒了就躺平 ：）</h3>
        </div>
        <div class="col-1"></div>
      </div>
    </nav>
  </header>

  <main class="flex-grow-1">
    <div class="container pb-5 pt-5 px-4">
      <div class="row">
        <!-- Carousel區塊 -->
        <div class="col-md-4 col-12">
          <div id="carousel-demo" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
            <ol class="carousel-indicators">
              <li data-bs-target="#carousel-demo" data-bs-slide-to="0" class="active"></li>
              <li data-bs-target="#carousel-demo" data-bs-slide-to="1"></li>
              <li data-bs-target="#carousel-demo" data-bs-slide-to="2"></li>
              <li data-bs-target="#carousel-demo" data-bs-slide-to="3"></li>
              <li data-bs-target="#carousel-demo" data-bs-slide-to="4"></li>
            </ol>
            <div class="carousel-inner" style="height: 444px;">
              <div class="carousel-item active">
                <img class="d-block w-100" src="./img/去礁溪.jpg" alt="">
              </div>
              <div class="carousel-item">
                <img class="d-block w-100" src="./img/火車.jpg" alt="">
              </div>
              <div class="carousel-item">
                <img class="d-block w-100" src="./img/燒肉smile.jpg" alt="">
              </div>
              <div class="carousel-item">
                <img class="d-block w-100" src="./img/冰淇淋.jpg" alt="">
              </div>
              <div class="carousel-item">
                <img class="d-block w-100" src="./img/奶酪.jpg" alt="">
              </div>
              <a href="#carousel-demo" class="carousel-control-prev" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
              </a>
              <a href="#carousel-demo" class="carousel-control-next" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
              </a>
            </div>
          </div>
        </div>

        <div class="col-md-8 col-12 d-flex flex-wrap justify-content-around align-items-center">
          <div class="col-2 align-self-center">
            <div class="icon-box">
              <object data="./img/landscape.svg" width="100" height="100"> </object>
              <p class="text-end"> 天文</p>
            </div>
            <div class="icon-box">
              <object data="./img/nature_people.svg" width="100" height="100"> </object>
              <p class="text-end"> 出去玩 </p>
            </div>
          </div>
          <div class="col-2 align-self-center">
            <div class="icon-box">
              <object data="./img/sports_basketball.svg" width="100" height="100"> </object>
              <p class="text-end"> 籃球 </p>
            </div>
            <div class="icon-box">
              <object data="./img/train.svg" width="100" height="100"> </object>
              <p class="text-center"> 拍火車 </p>
            </div>
          </div>
          <div class="col-2 align-self-center">
            <div class="icon-box">
              <object data="./img/icecream.svg" width="100" height="100"> </object>
              <p class="text-end"> 吃好吃的</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-light">
    <div class="container-fluid d-flex justify-content-end">
      <p class="d-flex align-items-center">
        <span class="material-symbols-outlined">mail</span>
        <span class="ms-2">&emsp;yingjung1128.mg11@nycu.edu.tw</span>
      </p>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
